# Pile complète : docker compose up --build  →  front http://localhost:3000, API http://localhost:8000/docs
# Variables lues depuis .env à la racine (voir .env.example). SECRET_KEY est obligatoire.
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenguard_dev}
      POSTGRES_DB: greenguard
    ports:
      - "127.0.0.1:5432:5432"   # accessible depuis le poste uniquement, jamais depuis le réseau
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenguard -d greenguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back_end
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment: &env_backend
      DATABASE_URL: postgresql://greenguard:${POSTGRES_PASSWORD:-greenguard_dev}@db:5432/greenguard
      SECRET_KEY: ${SECRET_KEY:?Définir SECRET_KEY dans .env (voir .env.example)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}   # http://localhost est un contexte sécurisé pour les navigateurs
      HSTS: ${HSTS:-false}                    # true uniquement derrière HTTPS
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10} # tentatives de connexion/inscription par minute et par IP
      LOG_FORMAT: json
      ENABLE_SCHEDULER: "false"               # le job tourne dans le service worker (ADR-5)
    depends_on:
      db:
        condition: service_healthy

  # Tâches planifiées (bilan hydrique horaire) : UNE seule instance
  worker:
    build:
      context: ./back_end
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment: *env_backend
    healthcheck:
      disable: true            # pas de serveur HTTP dans le worker
    depends_on:
      backend:
        condition: service_healthy   # le backend applique les migrations au démarrage

  frontend:
    build:
      context: ./front_end
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}   # autorisée par la CSP (connect-src)
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
