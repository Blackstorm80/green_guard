name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests SQLite + PostgreSQL, migrations, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back_end
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gg
          POSTGRES_PASSWORD: gg_ci
          POSTGRES_DB: gg_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gg -d gg_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: cle-ci-uniquement-0123456789abcdef0123
      PG_URL: postgresql://gg:gg_ci@localhost:5432/gg_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: back_end/requirements*.txt
      - run: pip install -r requirements-dev.txt pip-audit

      - name: Lint (ruff, règles de sécurité incluses)
        run: ruff check .

      - name: Tests + couverture (SQLite)
        run: pytest --cov=domain --cov=application --cov=api --cov=infrastructure --cov-fail-under=85

      - name: Migrations sur PostgreSQL (upgrade, absence de dérive, downgrade)
        run: |
          DATABASE_URL=$PG_URL alembic upgrade head
          DATABASE_URL=$PG_URL alembic check
          DATABASE_URL=$PG_URL alembic downgrade base

      - name: Tests sur PostgreSQL
        run: TEST_DATABASE_URL=$PG_URL pytest --ignore=tests/test_migrations.py

      - name: Audit des dépendances (CVE)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Audit des dépendances (vulnérabilités hautes et critiques)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Bout en bout (pile Docker, Playwright, audit axe WCAG AA)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SECRET_KEY: cle-ci-e2e-uniquement-0123456789abcdef0123
      POSTGRES_PASSWORD: gg_ci_e2e
      AUTH_RATE_LIMIT: "1000"   # chaque test crée un compte
    steps:
      - uses: actions/checkout@v4
      - name: Construire et démarrer la pile (db, backend, worker, frontend)
        run: docker compose up --build -d
      - name: Attendre l'API et le front
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/api/v1/health/ready && curl -sf http://localhost:3000/ >/dev/null && exit 0
            sleep 2
          done
          docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - working-directory: front_end
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - working-directory: front_end
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: front_end/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down -v
